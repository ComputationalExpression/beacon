- description: "[BEACON] Program runs and mentions your own name"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_program_runs_and_prints

- description: "[BEACON] Turns the tower light on when asked"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_beacon_on

- description: "[BEACON] Leaves the tower dark when declined"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_beacon_off

- description: "[AIM] Aiming at town puts 3 cars in sight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_aim_town

- description: "[AIM] Aiming at the road puts 1 car in sight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_aim_road

- description: "[AIM] Any other answer aims at the woods and puts 2 cars in sight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_aim_woods

- description: "[WIND] A reading of 150 or more is CRITICAL"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_critical

- description: "[WIND] A reading of 80 or more is HIGH"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_high

- description: "[WIND] A reading of 20 or more is STEADY"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_steady

- description: "[WIND] Anything below 20 is CALM"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_calm

- description: "[WIND] Exactly 80 counts as HIGH, not STEADY"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_boundary_is_inclusive

- description: "[RIDE] The code and enough charge together get you picked up"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_ride_picked_up_with_code_and_charge

- description: "[RIDE] The code with too little charge strands you"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_ride_stranded_when_charge_is_low

- description: "[RIDE] A full charge never answers the truck without the code"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_ride_left_behind_without_code

- src/main.py:
  - description: "[LOG] No TODO markers remain in main.py"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[LOG] Contains at least eight comments"
    check: CountSingleLineComments
    options:
      language: Python
      count: 8
      exact: false
  - description: "[LOG] Conditionals only: the word `for` appears nowhere in main.py"
    check: MatchFileRegex
    options:
      regex: "\\bfor\\b"
      count: 0
      exact: true
  - description: "[LOG] Conditionals only: the word `while` appears nowhere in main.py"
    check: MatchFileRegex
    options:
      regex: "\\bwhile\\b"
      count: 0
      exact: true

- docs/summary.md:
  - description: "[SUMMARY] The summary document contains no TODOs"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[SUMMARY] The summary document meets the word count"
    check: CountFileWords
    options:
      count: 150
      exact: false
