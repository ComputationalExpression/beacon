- description: "[BEACON] Program runs and mentions the keeper's own name"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_program_runs_and_prints

- description: "[BEACON] Turns the beacon on when asked"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_beacon_on

- description: "[BEACON] Leaves the beacon dark when declined"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_beacon_off

- description: "[AIM] Aiming north puts 3 villages in sight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_aim_north

- description: "[AIM] Aiming south puts 1 village in sight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_aim_south

- description: "[AIM] Any other answer aims east and puts 2 villages in sight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_aim_east

- description: "[WIND] A reading of 150 or more is CRITICAL"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_critical

- description: "[WIND] A reading of 80 or more is HIGH"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_high

- description: "[WIND] A reading of 20 or more is STEADY"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_steady

- description: "[WIND] Anything below 20 is CALM"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_calm

- description: "[WIND] Exactly 80 counts as HIGH, not STEADY"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_boundary_is_inclusive

- description: "[SIGNAL] The code and enough charge together relay the signal"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_signal_relayed_with_code_and_charge

- description: "[SIGNAL] The code with too little charge fades out"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_signal_faded_when_charge_is_low

- description: "[SIGNAL] A full charge never sends the signal without the code"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_signal_silent_without_code

- src/main.py:
  - description: "[LOG] No TODO markers remain in main.py"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[LOG] Contains at least eight comments"
    check: CountSingleLineComments
    options:
      language: Python
      count: 8
      exact: false
  - description: "[LOG] Conditionals only: the word `for` appears nowhere in main.py"
    check: MatchFileRegex
    options:
      regex: "\\bfor\\b"
      count: 0
      exact: true
  - description: "[LOG] Conditionals only: the word `while` appears nowhere in main.py"
    check: MatchFileRegex
    options:
      regex: "\\bwhile\\b"
      count: 0
      exact: true

- docs/summary.md:
  - description: "[SUMMARY] The summary document contains no TODOs"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[SUMMARY] The summary document meets the word count"
    check: CountFileWords
    options:
      count: 150
      exact: false
