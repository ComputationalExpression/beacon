# Fifteen checks: eight run your program, five read src/main.py, two read docs/summary.md.
# The eight program checks read only the tower log at the end of a run, never the story
# lines, and they forgive extra spaces, letter case, and a missing colon.

- description: "[BEACON] The tower log names you: TODO 1 saves the name, and TODO 10 prints TOWER LOG with it"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_program_runs_and_log_names_you

- description: "[BEACON] Tower light logs LIT for yes and DARK for anything else: set `light` inside both branches, not after them"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_tower_light_answers_yes_and_no

- description: "[WIND] A reading of 180 comes out CRITICAL: test the strongest range first, or a weaker branch claims it"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_strongest_reading_is_critical

- description: "[WIND] Exactly 150, 80, 20, and 5 land in CRITICAL, HIGH, STEADY, CALM: each threshold is `>=`, not `>`"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_wind_each_threshold_is_inclusive

- description: "[TREE LINE] One sign alone logs NOT ALONE: join the two answers with `or`, since `and` needs both"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_tree_line_one_sign_alone_is_enough

- description: "[TREE LINE] No sign logs CLEAR and both signs log NOT ALONE: the else sets `tree_line` too"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_tree_line_clear_without_either_sign

- description: "[RIDE] With the code, 80 percent logs PICKED UP and 10 percent logs STRANDED: the code is checked first, then the battery"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_ride_charge_decides_once_the_code_is_known

- description: "[RIDE] No code with a full battery logs LEFT BEHIND: the battery only counts once the code is known, so nest the charge check or put `and` on the pickup"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_beacon.py::test_ride_full_charge_never_answers_without_the_code

- src/main.py:
  - description: "[CODE] No TODO markers remain: delete each TODO comment once its code is written, including Author"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[CODE] At least six comments: explain why a decision is ordered or nested the way it is"
    check: CountSingleLineComments
    options:
      language: Python
      count: 6
      exact: false
  # One if (or elif) line whose condition joins two comparisons with `or` or `and`.
  # Comment lines start with `#`, so a TODO that mentions the word cannot pass this.
  - description: "[CODE] An if joins two conditions with `or` or `and`: the tree line is one if, not two"
    check: MatchFileRegex
    options:
      regex: "\\n[ \\t]*(if|elif)\\b[^\\n]*\\b(or|and)\\b[^\\n]*:"
      count: 1
      exact: false
  # Either an if indented two levels inside main(), so it belongs to another block, or an
  # if/elif line whose condition uses `and`.
  - description: "[CODE] The ride home is one if inside another, or one if with `and`: either way the code is checked before the battery counts"
    check: MatchFileRegex
    options:
      regex: "\\n( {8,}|\\t{2,})(if|elif)\\b|\\n[ \\t]*(if|elif)\\b[^\\n]*\\band\\b[^\\n]*:"
      count: 1
      exact: false
  # Greps every line of the file, prose included, so neither word may appear even in a comment.
  - description: "[CODE] Conditionals only, no `for` or `while`: write the three flashes out by hand, one line each"
    check: MatchFileRegex
    options:
      regex: "\\b(for|while)\\b"
      count: 0
      exact: true

- docs/summary.md:
  - description: "[SUMMARY] No TODO markers remain in docs/summary.md: replace each one with your answer, then delete it"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[SUMMARY] At least 150 words in docs/summary.md: answer every question in full sentences"
    check: CountFileWords
    options:
      count: 150
      exact: false
