[project]
name = "lab-02-beacon"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "gatorgrade",
    "pytest",
    "mockro",
    "mpremote",
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]
